<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b6884f">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Sticky Notes by Prepex</title>
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<div id="gate" class="admin-gate">
  <div class="admin-gate-card">
    <img src="../logo.svg" alt="" class="admin-gate-logo">
    <h1>Admin — Sticky Notes by Prepex</h1>
    <p>Enter the admin passphrase to view analytics.</p>
    <input id="passphrase" type="password" placeholder="Passphrase" autocomplete="off">
    <button id="unlock-btn" class="primary-btn">Unlock</button>
    <p id="gate-error" class="admin-error"></p>
  </div>
</div>

<main id="dashboard" class="admin-dashboard hidden">
  <header class="admin-header">
    <div class="brand"><img src="../logo.svg" class="brand-logo" alt=""><span class="brand-text">Sticky Notes <span class="brand-by">Admin</span></span></div>
    <button id="refresh-btn" class="ghost-btn">Refresh</button>
  </header>

  <div class="stat-cards" id="admin-stat-cards"></div>

  <div class="panel">
    <h2 class="panel-title">Page views — last 7 days</h2>
    <div id="views-chart" class="bar-chart"></div>
  </div>
</main>

<script src="admin.js"></script>
</body>
</html>
